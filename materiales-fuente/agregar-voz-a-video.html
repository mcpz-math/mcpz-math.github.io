<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agregar voz a un video ya hecho</title>
<!--
  Para los videos que no tienen su generador (generar-video-*.html): lee el .mp4 ya terminado, le agrega la voz
  en off y escribe un .mp4 nuevo. La imagen no se vuelve a dibujar: se decodifican sus cuadros y se vuelven a
  codificar; donde la voz necesita más tiempo que el que hay entre una cosa y la siguiente, el cuadro se
  CONGELA (en el punto "h" de la frase) hasta que termine de hablar.
  Uso (desde un servidor local, en Chrome/Edge o en el navegador integrado), en la consola:
    await eventos(url)                       lista de momentos en que cambia la imagen (para escribir el guion)
    await contacto(url, [seg, seg, …], 'n')  hoja de contacto con esos instantes (se sube a /subir/n.jpg)
    await agregarVoz(video, url, 'sal.mp4')  usa voz/<video>.json (frases con "s" y, opcional, "h") y sus .wav
  El guion: { "escenas": [ { "n": 0, "voz": [ { "s": 3.2, "h": 6.5, "texto": "…" }, … ] } ] }
    s = segundo del video ORIGINAL donde empieza la frase;  h = segundo donde se congela la imagen si hace falta.
-->
<style>body{margin:0;background:#222;color:#eee;font:14px sans-serif}canvas{display:block;width:640px}</style>
</head>
<body>
<canvas id="c" width="1440" height="945"></canvas>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script type="module">
import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs';
import { mezclar } from './voz-video.mjs';

const SR = 48000, FPS = 30, HUECO = .35, COLA = .8;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dormir = ms => new Promise(r => setTimeout(r, ms));
// ceder el turno sin usar temporizadores (el panel oculto los frena a 1 s)
const ceder = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => { c.port1.close(); r(); }; c.port2.postMessage(0); });
async function subir(nombre, blob) { await fetch('/subir/' + nombre, { method: 'POST', body: blob }); }

// ---------- leer el mp4 (mp4box) ----------
async function leer(url) {
  const ab = await (await fetch(url)).arrayBuffer();
  const f = MP4Box.createFile(); const muestras = []; let tr, desc;
  f.onError = e => console.error(e);
  f.onReady = info => {
    tr = info.videoTracks[0];
    const trak = f.getTrackById(tr.id);
    for (const e of trak.mdia.minf.stbl.stsd.entries) {
      const b = e.avcC || e.hvcC; if (!b) continue;
      const ds = new DataStream(undefined, 0, DataStream.BIG_ENDIAN); b.write(ds); desc = new Uint8Array(ds.buffer, 8); break;
    }
    f.setExtractionOptions(tr.id, null, { nbSamples: 500 });
    f.start();
  };
  f.onSamples = (id, u, ss) => { for (const s of ss) muestras.push(s); };
  ab.fileStart = 0; f.appendBuffer(ab); f.flush();
  await dormir(300);
  const fps = Math.round(tr.nb_samples / (tr.duration / tr.timescale));
  return { tr, desc, muestras, fps, dur: muestras.length / fps, t0: Math.min(...muestras.map(m => m.cts / m.timescale)) };
}

// decodifica todos los cuadros, en orden, y llama alFrame(frame, segundos)
async function decodificar(src, alFrame) {
  const cola = [];
  const D = new VideoDecoder({ output: fr => cola.push(fr), error: e => { window.estado = 'error decodificador ' + e; } });
  D.configure({ codec: src.tr.codec, codedWidth: src.tr.video.width, codedHeight: src.tr.video.height, description: src.desc });
  const vaciar = async () => { while (cola.length) { const fr = cola.shift(); await alFrame(fr, fr.timestamp / 1e6 - src.t0); fr.close(); } };
  for (const s of src.muestras) {
    D.decode(new EncodedVideoChunk({ type: s.is_sync ? 'key' : 'delta', timestamp: Math.round(1e6 * s.cts / s.timescale), duration: Math.round(1e6 * s.duration / s.timescale), data: s.data }));
    while (D.decodeQueueSize > 6) { await ceder(); await vaciar(); }
    await vaciar();
  }
  let hecho = false; const fin = D.flush().then(() => { hecho = true; });
  while (!hecho) { await ceder(); await vaciar(); }   // seguir vaciando mientras termina, o el decodificador se frena
  await fin; await vaciar(); D.close();
}

// ---------- 1. momentos en que cambia la imagen ----------
async function eventos(url, umbral = 1.2) {
  const src = await leer(url), pq = document.createElement('canvas'); pq.width = 64; pq.height = 36;
  const px = pq.getContext('2d', { willReadFrequently: true });
  let prev = null, ev = [], cur = null;
  await decodificar(src, async (fr, t) => {
    px.drawImage(fr, 0, 0, 64, 36);
    const d = px.getImageData(0, 0, 64, 36).data; let dif = 0;
    if (prev) { for (let i = 0; i < d.length; i += 4) dif += Math.abs(d[i] - prev[i]) + Math.abs(d[i + 1] - prev[i + 1]) + Math.abs(d[i + 2] - prev[i + 2]); dif /= (64 * 36 * 3); }
    prev = d.slice();
    if (dif > umbral * .12) { if (cur && t - cur.fin < .5) cur.fin = t; else { cur = { ini: t, fin: t }; ev.push(cur); } }
  });
  return { dur: +src.dur.toFixed(2), eventos: ev.map(e => [+e.ini.toFixed(1), +e.fin.toFixed(1)]) };
}

// ---------- 1b. todo en una sola pasada: cada vez que la imagen cambia y se queda quieta, guarda ese cuadro ----------
// devuelve [{n, cambio (seg donde empezó el cambio), quieto (seg donde ya está quieta)}] y sube hojas nombre-1.jpg …
async function analizar(url, nombre = 'hoja', { umbral = .15, quietud = .8 } = {}) {
  const src = await leer(url), pq = document.createElement('canvas'); pq.width = 64; pq.height = 36;
  const px = pq.getContext('2d', { willReadFrequently: true });
  const caps = []; let prev = null, cambio = null, ult = -9, pend = false;
  const capturar = async (fr, t) => { const bm = await createImageBitmap(fr, { resizeWidth: 480, resizeHeight: 270 }); caps.push({ bm, t, cambio }); pend = false; };
  await decodificar(src, async (fr, t) => {
    px.drawImage(fr, 0, 0, 64, 36);
    const d = px.getImageData(0, 0, 64, 36).data; let dif = 0;
    if (prev) { for (let i = 0; i < d.length; i += 4) dif += Math.abs(d[i] - prev[i]) + Math.abs(d[i + 1] - prev[i + 1]) + Math.abs(d[i + 2] - prev[i + 2]); dif /= (64 * 36 * 3); }
    prev = d.slice();
    if (dif > umbral) { if (!pend) cambio = t; pend = true; ult = t; }
    else if (pend && t - ult >= quietud) await capturar(fr, t);
  });
  const lista = [];
  for (let p = 0; p * 9 < caps.length; p++) {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let j = 0; j < 9 && p * 9 + j < caps.length; j++) {
      const i = p * 9 + j, c = caps[i], x = (j % 3) * 480, y = Math.floor(j / 3) * 315;
      ctx.drawImage(c.bm, x, y); ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`${i + 1}:  cambio ${c.cambio.toFixed(1)} s · quieto ${c.t.toFixed(1)} s`, x + 8, y + 296);
    }
    await subir(`${nombre}-${p + 1}.jpg`, await new Promise(r => cv.toBlob(r, 'image/jpeg', .9)));
  }
  caps.forEach((c, i) => lista.push([i + 1, +c.cambio.toFixed(1), +c.t.toFixed(1)]));
  return { dur: +src.dur.toFixed(1), hojas: Math.ceil(caps.length / 9), lista };
}

// ---------- 2. hojas de contacto (9 por imagen, 3×3); nombre-1.jpg, nombre-2.jpg … ----------
async function contacto(url, tiempos, nombre = 'contacto') {
  const src = await leer(url), W = 480, CH = 315;
  const orden = tiempos.map((t, i) => ({ t, i })).sort((a, b) => a.t - b.t); let k = 0, pag = -1;
  const limpiar = () => { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, cv.width, cv.height); };
  const guardar = async () => { if (pag < 0) return; const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9)); await subir(`${nombre}-${pag + 1}.jpg`, b); };
  await decodificar(src, async (fr, t) => {
    while (k < orden.length && t >= orden[k].t) {
      const i = orden[k].i, p = Math.floor(i / 9), j = i % 9;
      if (p !== pag) { await guardar(); pag = p; limpiar(); }
      const x = (j % 3) * 480, y = Math.floor(j / 3) * CH;
      ctx.drawImage(fr, x, y, W, 270); ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`${i + 1}:  ${orden[k].t.toFixed(1)} s`, x + 8, y + 296);
      k++;
    }
  });
  await guardar();
  return 'ok ' + nombre + ' (' + (pag + 1) + ' hojas)';
}

// ---------- 3. agregar la voz ----------
async function agregarVoz(video, url, salida, opc = {}) {
  const base = '/materiales-fuente/voz/';
  window.estado = 'leyendo guion';
  const guion = await (await fetch(`${base}${video}.json`)).json();
  const ac = new AudioContext({ sampleRate: SR });
  const cues = [];
  for (const e of guion.escenas) for (let j = 0; j < e.voz.length; j++) {
    const nom = `e${String(e.n).padStart(2, '0')}-${j}.wav`;
    const buf = await ac.decodeAudioData(await (await fetch(`${base}${video}/${nom}`)).arrayBuffer());
    cues.push({ s: e.voz[j].s, h: e.voz[j].h, datos: buf.getChannelData(0), d: buf.duration });
  }
  const src = await leer(url), dur = src.dur, FPS = src.fps; // los cuadros por segundo salen del propio video (25 ó 30)
  // congelar: si la frase dura más que el tiempo hasta la siguiente, se congela la imagen en h
  const pausas = [];
  cues.forEach((c, i) => {
    const sig = i < cues.length - 1 ? cues[i + 1].s : dur, ventana = sig - c.s;
    const falta = c.d + (i < cues.length - 1 ? HUECO : COLA) - ventana;
    if (falta > 0) {
      let h = c.h !== undefined ? c.h : Math.max(c.s + .8, sig - .8); h = Math.min(h, sig - .05, dur - .05);
      pausas.push({ p: h, extra: Math.round(falta * FPS) / FPS, i });
    }
  });
  pausas.sort((a, b) => a.p - b.p);
  const salidaDe = s => s + pausas.filter(q => q.p <= s).reduce((a, q) => a + q.extra, 0);
  const NF = src.muestras.length + pausas.reduce((a, q) => a + Math.round(q.extra * FPS), 0), DUR = NF / FPS;
  console.log('pausas', pausas.map(q => `${q.p.toFixed(1)}s +${q.extra.toFixed(1)}`).join('  '), 'duración', dur.toFixed(1), '→', DUR.toFixed(1));
  // música
  const musica = await ac.decodeAudioData(await (await fetch('/materiales-fuente/musica-bach.mp4')).arrayBuffer());
  const pcm = mezclar(DUR, [musica.getChannelData(0), musica.getChannelData(1)], cues.map(c => ({ inicio: salidaDe(c.s), datos: c.datos })));
  const W = src.tr.video.width, H = src.tr.video.height;
  const muxer = new Muxer({ target: new ArrayBufferTarget(), fastStart: 'in-memory',
    video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR } });
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { window.estado = 'error video ' + e; } });
  ve.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: opc.br || 500000, bitrateMode: 'variable', framerate: FPS, hardwareAcceleration: opc.hw || 'prefer-software' });
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { window.estado = 'error audio ' + e; } });
  ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 96000 });
  let n = 0, ip = 0;
  await decodificar(src, async (fr, t) => {
    let veces = 1;
    while (ip < pausas.length && t >= pausas[ip].p - 1e-6) { veces += Math.round(pausas[ip].extra * FPS); ip++; }
    for (let r = 0; r < veces; r++) {
      const vf = new VideoFrame(fr, { timestamp: Math.round(n * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      ve.encode(vf, { keyFrame: n % 150 === 0 }); vf.close(); n++;
      while (ve.encodeQueueSize > 12) await ceder();
    }
    if (n % 300 < veces) window.estado = `video ${n}/${NF}`;
  });
  window.estado = 'audio';
  const N = pcm[0].length, CH = SR;
  for (let s = 0; s < N; s += CH) {
    const k = Math.min(CH, N - s), data = new Float32Array(k * 2);
    data.set(pcm[0].subarray(s, s + k), 0); data.set(pcm[1].subarray(s, s + k), k);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: k, numberOfChannels: 2, timestamp: Math.round(s * 1e6 / SR), data });
    ae.encode(ad); ad.close();
  }
  await ve.flush(); await ae.flush(); muxer.finalize();
  const buf = muxer.target.buffer;
  window.estado = 'subiendo ' + buf.byteLength;
  await subir(salida, new Blob([buf], { type: 'video/mp4' }));
  window.estado = 'listo ' + buf.byteLength;
  return { bytes: buf.byteLength, cuadrosEntrada: src.muestras.length, cuadrosSalida: n, esperados: NF, dur: DUR };
}

Object.assign(window, { leer, decodificar, eventos, analizar, contacto, agregarVoz });
window.listo = true;
</script>
</body>
</html>
