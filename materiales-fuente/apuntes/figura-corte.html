<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Figura: corte del cono</title>
<style>html, body { margin: 0; background: #fff; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<!-- Dibuja UNA figura del corte del plano al cono (?c=circ | elip | parab | hip). Se usa para sacar los PNG del apunte en Word:
     msedge --headless --screenshot=<archivo.png> --window-size=560,580 <esta página>?c=circ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var type = (location.search.match(/c=(\w+)/) || [0, 'circ'])[1];
  var T = THREE, H = 1.25, PI = Math.PI, W = 560, Hh = 580;
  function curveMesh(pts, closed) {
    var c = new T.CatmullRomCurve3(pts, closed);
    var m = new T.Mesh(new T.TubeGeometry(c, pts.length * 2, 0.045, 10, closed), new T.MeshBasicMaterial({ color: 0xd9650b, transparent: true, depthTest: false }));
    m.renderOrder = 5; return m;
  }
  function planeMesh(point, normal, size) {
    var m = new T.Mesh(new T.PlaneGeometry(size, size), new T.MeshBasicMaterial({ color: 0xc4e86b, transparent: true, opacity: 0.55, side: T.DoubleSide, depthWrite: false }));
    m.position.copy(point); m.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), normal.clone().normalize());
    m.add(new T.LineSegments(new T.EdgesGeometry(m.geometry), new T.LineBasicMaterial({ color: 0x14301f }))); m.renderOrder = 3; return m;
  }
  function sceneFor(type, g) {
    var i, t, y, pts, c, m;
    if (type === 'circ') {
      g.add(planeMesh(new T.Vector3(0, 0.7, 0), new T.Vector3(0, 1, 0), 2.7));
      pts = []; for (i = 0; i < 72; i++) { t = 2 * PI * i / 72; pts.push(new T.Vector3(0.7 * Math.cos(t), 0.7, 0.7 * Math.sin(t))); } g.add(curveMesh(pts, true));
    } else if (type === 'elip') {
      c = 0.6; m = 0.4; g.add(planeMesh(new T.Vector3(0, c, 0), new T.Vector3(0, 1, -m), 2.6));
      pts = []; for (i = 0; i < 96; i++) { t = 2 * PI * i / 96; y = c / (1 - m * Math.sin(t)); pts.push(new T.Vector3(y * Math.cos(t), y, y * Math.sin(t))); } g.add(curveMesh(pts, true));
    } else if (type === 'parab') {
      c = 0.5; g.add(planeMesh(new T.Vector3(0, c, 0), new T.Vector3(0, 1, -1), 2.7));
      pts = []; for (i = 1; i < 800; i++) { t = PI / 2 + 2 * PI * i / 800; y = c / (1 - Math.sin(t)); if (y <= 1.2) pts.push(new T.Vector3(y * Math.cos(t), y, y * Math.sin(t))); } g.add(curveMesh(pts, false));
    } else {
      var z0 = 0.4, X = Math.sqrt(1.2 * 1.2 - z0 * z0), a = [], b = [];
      g.add(planeMesh(new T.Vector3(0, 0, z0), new T.Vector3(0, 0, 1), 2.7));
      for (i = 0; i <= 50; i++) { var x = -X + 2 * X * i / 50, yy = Math.sqrt(x * x + z0 * z0); a.push(new T.Vector3(x, yy, z0)); b.push(new T.Vector3(x, -yy, z0)); }
      g.add(curveMesh(a, false)); g.add(curveMesh(b, false));
    }
  }
  var renderer = new T.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(W, Hh); renderer.setClearColor(0xffffff, 1); document.body.appendChild(renderer.domElement);
  var scene = new T.Scene(), cam = new T.PerspectiveCamera(32, W / Hh, 0.1, 50), g = new T.Group(), k;
  cam.position.set(0, 0.8, 6.4); cam.lookAt(0, 0, 0);
  scene.add(new T.AmbientLight(0xffffff, 0.8)); var dl = new T.DirectionalLight(0xffffff, 0.6); dl.position.set(2, 4, 3); scene.add(dl); scene.add(g);
  var cm = new T.MeshLambertMaterial({ color: 0x3f6b4a, transparent: true, opacity: 0.3, side: T.DoubleSide, depthWrite: false });
  var up = new T.Mesh(new T.CylinderGeometry(H, 0, H, 64, 1, true), cm); up.position.y = H / 2;
  var dn = new T.Mesh(new T.CylinderGeometry(0, H, H, 64, 1, true), cm); dn.position.y = -H / 2; g.add(up, dn);
  var lm = new T.LineBasicMaterial({ color: 0x14301f, transparent: true, opacity: 0.5 }), seg = [], ring = [], ring2 = [];
  for (k = 0; k < 24; k++) { var q = 2 * PI * k / 24, cx = H * Math.cos(q), cz = H * Math.sin(q); seg.push(0, 0, 0, cx, H, cz, 0, 0, 0, cx, -H, cz); }
  for (k = 0; k <= 64; k++) { var r = 2 * PI * k / 64; ring.push(new T.Vector3(H * Math.cos(r), H, H * Math.sin(r))); ring2.push(new T.Vector3(H * Math.cos(r), -H, H * Math.sin(r))); }
  var gl = new T.BufferGeometry(); gl.setAttribute('position', new T.Float32BufferAttribute(seg, 3));
  g.add(new T.LineSegments(gl, lm), new T.Line(new T.BufferGeometry().setFromPoints(ring), new T.LineBasicMaterial({ color: 0x14301f })), new T.Line(new T.BufferGeometry().setFromPoints(ring2), new T.LineBasicMaterial({ color: 0x14301f })));
  g.add(new T.Mesh(new T.SphereGeometry(0.05, 12, 12), new T.MeshBasicMaterial({ color: 0x14301f })));
  sceneFor(type, g);
  g.rotation.set(0.38, -0.7, 0);
  renderer.render(scene, cam);
})();
</script>
</body>
</html>
