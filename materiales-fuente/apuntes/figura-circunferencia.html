<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Figuras: circunferencia con centro en el origen</title>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; }
  svg { display: none; }
  body.ecuacion svg#ecuacion, body.grafica svg#grafica { display: block; }
</style>
</head>
<body>
<!-- Dibuja una figura (?f=ecuacion | grafica) para el apunte en Word. Se imprime con:
     msedge --headless --force-device-scale-factor=2 --screenshot=<archivo.png> --window-size=<ancho>,<alto> <esta página>?f=ecuacion  -->
<svg id="ecuacion" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="Circunferencia con centro en el origen">
  <g stroke="#56604f" stroke-width="1.6" fill="none"><line x1="20" y1="170" x2="340" y2="170"/><line x1="150" y1="290" x2="150" y2="14"/></g>
  <circle cx="150" cy="170" r="110" fill="rgba(196,232,107,0.35)" stroke="#14301f" stroke-width="2.8"/>
  <line x1="150" y1="170" x2="234" y2="170" stroke="#3f6b4a" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="234" y1="170" x2="234" y2="99" stroke="#3f6b4a" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="150" y1="170" x2="234" y2="99" stroke="#d9650b" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="150" cy="170" r="5" fill="#14301f"/><circle cx="234" cy="99" r="5.5" fill="#d9650b" stroke="#14301f" stroke-width="1.5"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#14301f">
    <text x="342" y="188">x</text><text x="158" y="16">y</text><text x="96" y="188">(0, 0)</text><text x="242" y="94">P(x, y)</text>
    <text x="184" y="124" fill="#d9650b" font-weight="700">r</text><text x="186" y="190" fill="#3f6b4a">x</text><text x="242" y="140" fill="#3f6b4a">y</text>
  </g>
</svg>
<svg id="grafica" viewBox="0 0 378 320" width="378" height="320" role="img" aria-label="Gráfica de x² + y² = 25">
  <g transform="translate(18,0)">
  <g stroke="#dde2dc" stroke-width="1">
    <line x1="30" y1="10" x2="30" y2="310"/><line x1="55" y1="10" x2="55" y2="310"/><line x1="80" y1="10" x2="80" y2="310"/><line x1="105" y1="10" x2="105" y2="310"/><line x1="130" y1="10" x2="130" y2="310"/><line x1="155" y1="10" x2="155" y2="310"/>
    <line x1="205" y1="10" x2="205" y2="310"/><line x1="230" y1="10" x2="230" y2="310"/><line x1="255" y1="10" x2="255" y2="310"/><line x1="280" y1="10" x2="280" y2="310"/><line x1="305" y1="10" x2="305" y2="310"/><line x1="330" y1="10" x2="330" y2="310"/>
    <line x1="30" y1="10" x2="330" y2="10"/><line x1="30" y1="35" x2="330" y2="35"/><line x1="30" y1="60" x2="330" y2="60"/><line x1="30" y1="85" x2="330" y2="85"/><line x1="30" y1="110" x2="330" y2="110"/><line x1="30" y1="135" x2="330" y2="135"/>
    <line x1="30" y1="185" x2="330" y2="185"/><line x1="30" y1="210" x2="330" y2="210"/><line x1="30" y1="235" x2="330" y2="235"/><line x1="30" y1="260" x2="330" y2="260"/><line x1="30" y1="285" x2="330" y2="285"/><line x1="30" y1="310" x2="330" y2="310"/>
  </g>
  <g stroke="#56604f" stroke-width="1.8" fill="none"><line x1="24" y1="160" x2="338" y2="160"/><line x1="180" y1="316" x2="180" y2="4"/></g>
  <circle cx="180" cy="160" r="125" fill="rgba(196,232,107,0.35)" stroke="#14301f" stroke-width="3"/>
  <g fill="#c4e86b" stroke="#14301f" stroke-width="1.8"><circle cx="305" cy="160" r="5.5"/><circle cx="55" cy="160" r="5.5"/><circle cx="180" cy="35" r="5.5"/><circle cx="180" cy="285" r="5.5"/></g>
  <circle cx="255" cy="60" r="5.5" fill="#d9650b" stroke="#14301f" stroke-width="1.8"/><circle cx="180" cy="160" r="4" fill="#14301f"/>
  <g font-family="Consolas, monospace" font-size="13" fill="#14301f">
    <text x="340" y="153">x</text><text x="188" y="14">y</text><text x="308" y="178">(5, 0)</text><text x="-12" y="178">(−5, 0)</text>
    <text x="188" y="32">(0, 5)</text><text x="188" y="300">(0, −5)</text><text x="262" y="56">(3, 4)</text><text x="130" y="176">(0, 0)</text>
  </g>
  </g>
</svg>
<script>document.body.className = (location.search.match(/f=(\w+)/) || [0, 'ecuacion'])[1];</script>
</body>
</html>
