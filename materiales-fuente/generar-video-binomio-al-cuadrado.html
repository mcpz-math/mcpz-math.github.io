<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador del video: binomio al cuadrado</title>
<!--
  Genera el video matematicas-3/materiales/tema-06-binomio-al-cuadrado.mp4
  dibujando cada cuadro en un <canvas> (1280×720, 30 cuadros por segundo, estilo "Compás"),
  lo codifica con WebCodecs (H.264 + AAC) y lo empaqueta en MP4 con mp4-muxer.
  La música es la misma de los otros videos (Preludio en Do mayor, BWV 846, de Bach): se toma
  de matematicas-1/materiales/jerarquia-de-operaciones.mp4.
  Uso: abrir esta página desde un servidor local (http://localhost:…/materiales-fuente/…) en
  Chrome/Edge y, en la consola, llamar  await hacerVideo()  (sube el .mp4 a /subir/…) o
  dibujarEn(segundos) para ver un cuadro.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Karla:wght@400;700&display=swap">
<style>body{margin:0;background:#222}canvas{width:960px;height:540px;display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs';

const W = 1280, H = 720, FPS = 30;
const C = { forest:'#14301f', cream:'#f6f3ea', lime:'#c4e86b', blue:'#2f6db5', orange:'#c2621b', red:'#b3261e',
            green:'#2f7d3b', plum:'#7b3fa0', mute:'#3a6b4a', line:'#d7d2c2', white:'#ffffff' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FM = 'Outfit, "DejaVu Sans", "Segoe UI", sans-serif', FT = 'Karla, "Segoe UI", sans-serif';
const MINUS = '−', PM = '±', DOT = '·';

// ---------- motor de fórmulas: texto, superíndice, subíndice, fracción apilada y raíz ----------
const t = (s, c) => ({ t: s, c }), sup = (n, c) => ({ sup: n, c }), sub = (n, c) => ({ sub: n, c });
const fr = (n, d) => ({ fr: [n, d] }), sq = n => ({ sq: n });
const bl = s => t(s, C.blue), or = s => t(s, C.orange), pl = s => t(s, C.plum), rd = s => t(s, C.red), gr = s => t(s, C.green);
const arr = n => Array.isArray(n) ? n : [n];
let FW = 600;
function setFont(sz) { ctx.font = `${FW} ${sz}px ${FM}`; }
function meas(nodes, sz) {
  let w = 0, asc = sz * .78, desc = 0;
  for (const n of arr(nodes)) { const r = measOne(n, sz); w += r.w; asc = Math.max(asc, r.asc); desc = Math.max(desc, r.desc); }
  return { w, asc, desc };
}
function measOne(n, sz) {
  if (Array.isArray(n)) return meas(n, sz);
  if (typeof n === 'string') n = { t: n };
  if (n.t !== undefined) { setFont(sz); return { w: ctx.measureText(n.t).width, asc: sz * .78, desc: 0 }; }
  if (n.sup) { const s = sz * .62, r = meas(n.sup, s); return { w: r.w + sz * .03, asc: sz * .42 + r.asc, desc: 0 }; }
  if (n.sub) { const s = sz * .62, r = meas(n.sub, s); return { w: r.w + sz * .03, asc: sz * .78, desc: sz * .2 + r.desc }; }
  if (n.fr) {
    const s = sz * .85, a = meas(n.fr[0], s), b = meas(n.fr[1], s);
    return { w: Math.max(a.w, b.w) + sz * .2, asc: sz * .42 + a.asc, desc: Math.max(0, b.asc + b.desc - sz * .18) };
  }
  if (n.sq) { const r = meas(n.sq, sz); return { w: r.w + sz * .52, asc: r.asc + sz * .16, desc: Math.max(r.desc, sz * .08) }; }
  return { w: 0, asc: 0, desc: 0 };
}
function drawSeq(nodes, x, y, sz, col) {
  let w = 0;
  for (const n of arr(nodes)) w += drawOne(n, x + w, y, sz, col);
  return w;
}
function drawOne(n, x, y, sz, col) {
  if (Array.isArray(n)) return drawSeq(n, x, y, sz, col);
  if (typeof n === 'string') n = { t: n };
  const c = n.c || col;
  if (n.t !== undefined) { setFont(sz); ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(n.t, x, y); return ctx.measureText(n.t).width; }
  if (n.sup) return drawSeq(n.sup, x, y - sz * .42, sz * .62, c) + sz * .03;
  if (n.sub) return drawSeq(n.sub, x, y + sz * .18, sz * .62, c) + sz * .03;
  if (n.fr) {
    const s = sz * .85, a = meas(n.fr[0], s), b = meas(n.fr[1], s), Wd = Math.max(a.w, b.w), x0 = x + sz * .1, axis = y - sz * .3;
    drawSeq(n.fr[0], x0 + (Wd - a.w) / 2, axis - sz * .12, s, c);
    drawSeq(n.fr[1], x0 + (Wd - b.w) / 2, axis + sz * .12 + b.asc, s, c);
    ctx.strokeStyle = c; ctx.lineWidth = Math.max(3, sz * .08); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x0 - sz * .04, axis); ctx.lineTo(x0 + Wd + sz * .04, axis); ctx.stroke();
    return Wd + sz * .2;
  }
  if (n.sq) {
    const inn = meas(n.sq, sz), top = y - inn.asc - sz * .08, bot = y + sz * .06;
    ctx.strokeStyle = c; ctx.lineWidth = Math.max(2, sz * .06); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + sz * .02, y - sz * .28); ctx.lineTo(x + sz * .1, y - sz * .33); ctx.lineTo(x + sz * .22, bot);
    ctx.lineTo(x + sz * .38, top); ctx.lineTo(x + sz * .42 + inn.w + sz * .08, top); ctx.stroke();
    drawSeq(n.sq, x + sz * .42, y, sz, c);
    return inn.w + sz * .52;
  }
  return 0;
}
// dibuja las fórmulas centradas / alineadas
function mathAt(nodes, x, y, sz, col = C.forest, align = 'left') {
  const m = meas(nodes, sz);
  const x0 = align === 'center' ? x - m.w / 2 : align === 'right' ? x - m.w : x;
  drawSeq(nodes, x0, y, sz, col);
  return m;
}
function mathMid(nodes, x, ymid, sz, col, align) { // centra verticalmente
  const m = meas(nodes, sz);
  mathAt(nodes, x, ymid + (m.asc - m.desc) / 2, sz, col, align);
  return m;
}

// ---------- utilidades de dibujo ----------
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const fade = (tt, at, d = .6) => ease((tt - at) / d);
function rr(x, y, w, h, r, fill, stroke, lw = 1.5) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function txt(s, x, y, sz, col, o = {}) {
  ctx.font = `${o.w || 400} ${sz}px ${o.f || FT}`; ctx.fillStyle = col; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y); return ctx.measureText(s).width;
}
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, a); fn(); ctx.restore(); }

function fondo() {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(196,232,107,.55)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, 0); ctx.lineTo(0, 130); ctx.fill();
  ctx.fillStyle = 'rgba(196,232,107,.38)'; ctx.beginPath(); ctx.arc(1230, 745, 135, 0, Math.PI * 2); ctx.fill();
  rr(936, 682, 330, 32, 16, 'rgba(20,48,31,.88)');
  ctx.fillStyle = C.lime; ctx.beginPath(); ctx.arc(953, 698, 4.5, 0, Math.PI * 2); ctx.fill();
  txt('DTI. Maria del Carmen Pérez Zarate', 964, 704, 16, '#eef3e6', { w: 700 });
}
function titulo(tt, s, y = 72, sz = 44) { withAlpha(fade(tt, .1), () => txt(s, W / 2, y, sz, C.forest, { w: 600, f: FM, align: 'center' })); }

// fila de un paso: tarjeta con explicación a la izquierda y fórmula a la derecha
function fila(tt, at, y, h, n, expl, math, o = {}) {
  withAlpha(fade(tt, at), () => {
    rr(60, y, 1160, h, 14, o.fill || C.white, o.stroke || C.line, o.lw || 1.5);
    let x = 88;
    if (n) x += txt(n, x, y + h / 2 + 8, 22, o.lab || C.mute, { w: 600, f: FM }) + 16;
    txt(expl, x, y + h / 2 + 8, 24, C.forest, { w: o.lime ? 700 : 400 });
  });
  if (math) withAlpha(fade(tt, at + 1.3), () => mathMid(math, 1196, y + h / 2, o.sz || 40, C.forest, 'right'));
}

// ---------- piezas de las ecuaciones ----------
const X2 = c => [t('x', c), sup('2', c)];
const iI = pl('i');
const X = bl('x');
const x1 = [bl('x'), sub('1', C.blue)], x2 = [bl('x'), sub('2', C.blue)];

// ---------- escenas ----------
const ESC = [];
function escena(dur, draw) { ESC.push({ dur, draw }); }

// ---------- piezas ----------
const aa = bl('a'), bb = or('b');
const a2 = [bl('a'), sup('2', C.blue)], b2 = [or('b'), sup('2', C.orange)];
const LIME = { fill: C.lime, stroke: C.lime, lime: true };

// escena de ejemplo: encabezado con el binomio y una fila por paso (rows: {at, n, expl, math, o})
function ejemplo(dur, n, head, rows, sz = 36, h = 70, y0 = 172, g = 9) {
  escena(dur, tt => {
    titulo(tt, 'Ejemplo ' + n, 60, 32);
    withAlpha(fade(tt, .3), () => mathAt(head, W / 2, 138, 60, C.forest, 'center'));
    rows.forEach((r, k) => fila(tt, r.at, y0 + k * (h + g), h, r.n, r.expl, r.math, Object.assign({ sz }, r.o || {})));
  });
}

// ---------- escenas ----------
// 0. Portada
escena(5, tt => {
  withAlpha(fade(tt, .2), () => txt('MATEMÁTICAS 3  ·  TEMA 6', W / 2, 190, 22, C.mute, { w: 700, align: 'center' }));
  withAlpha(fade(tt, .5), () => {
    ctx.font = `700 84px ${FM}`; const w2 = ctx.measureText('al cuadrado').width;
    txt('Binomio', W / 2, 300, 84, C.forest, { w: 600, f: FM, align: 'center' });
  });
  withAlpha(fade(tt, 1.1), () => txt('al cuadrado', W / 2, 396, 72, C.forest, { w: 700, f: FM, align: 'center' }));
  withAlpha(fade(tt, 1.8), () => mathAt(['(', aa, ' ± ', bb, ')', sup('2'), ' = ', a2, ' ± 2', aa, bb, ' + ', b2], W / 2, 490, 52, C.forest, 'center'));
  withAlpha(fade(tt, 2.8), () => {
    ctx.fillStyle = C.lime; ctx.fillRect(W / 2 - 130, 522, 260, 6);
    txt('Cómo se desarrolla, paso a paso', W / 2, 580, 30, C.forest, { align: 'center' });
  });
  withAlpha(fade(tt, 3), () => {
    ctx.strokeStyle = C.forest; ctx.lineWidth = 3; ctx.strokeRect(1054, 84, 92, 92);
    ctx.beginPath(); ctx.moveTo(1054, 84); ctx.lineTo(1146, 176); ctx.stroke();
  });
});

// 1. ¿Qué es un binomio al cuadrado?
escena(12, tt => {
  titulo(tt, '¿Qué es un binomio al cuadrado?');
  withAlpha(fade(tt, .8), () => mathAt(['(', bl('x'), ' + ', or('5'), ')', sup('2'), ' = (x + 5)(x + 5)'], W / 2, 196, 64, C.forest, 'center'));
  withAlpha(fade(tt, 1.6), () => txt('Un binomio multiplicado por sí mismo', W / 2, 252, 28, C.mute, { w: 700, align: 'center' }));
  withAlpha(fade(tt, 4), () => {
    rr(60, 330, 1160, 200, 18, C.lime);
    txt('SU RESULTADO', 96, 372, 20, C.forest, { w: 700 });
    txt('Siempre tiene tres términos y sigue una regla', 96, 420, 32, C.forest, { w: 700, f: FM });
    mathAt(['(', bl('x'), ' + ', or('5'), ')', sup('2'), ' = ', bl('x'), sup('2', C.blue), ' + 10x + ', or('25')], 96, 490, 46, C.forest);
  });
  withAlpha(fade(tt, 7.5), () => txt('Veamos cuál es la regla', W / 2, 600, 30, C.forest, { w: 600, f: FM, align: 'center' }));
});


// 2. ¿Es lo mismo que x² + 25?
escena(16, tt => {
  titulo(tt, '¿(x + 5)² es igual a x² + 25?');
  withAlpha(fade(tt, .8), () => txt('Vamos a probarlo con x = 1', W / 2, 130, 30, C.mute, { w: 700, align: 'center' }));
  const o = { sz: 40 }, h = 92;
  fila(tt, 2, 160, h, '', 'El valor verdadero es:', ['(1 + 5)', sup('2'), ' = 6', sup('2'), ' = 36'], o);
  fila(tt, 5.4, 266, h, '', '¿Y con x² + 25?', ['1', sup('2'), ' + 25 = 26   ', rd('✗')], { sz: 40, stroke: C.red, lw: 2.5 });
  fila(tt, 8.8, 372, h, '', 'Con la regla, x² + 10x + 25:', ['1 + 10 + 25 = 36   ', gr('✓')], { sz: 40, stroke: C.green, lw: 2.5 });
  withAlpha(fade(tt, 12), () => {
    rr(60, 490, 1160, 150, 18, C.lime);
    txt('¡CUIDADO!', 96, 530, 20, C.forest, { w: 700 });
    mathAt(['(a + b)', sup('2'), ' ≠ ', a2.map(n => n), ' + ', b2], 96, 590, 44, C.forest);
    txt('Falta el doble producto, el término de en medio', 560, 590, 26, C.forest, { w: 700 });
  });
});

// 4. La regla
escena(15, tt => {
  titulo(tt, 'La regla');
  const card = (at, y, sg) => withAlpha(fade(tt, at), () => {
    rr(60, y, 1160, 108, 16, C.white, C.line);
    mathMid(['(', aa, ' ' + sg + ' ', bb, ')', sup('2'), ' = ', a2, ' ' + sg + ' 2', aa, bb, ' + ', b2], W / 2, y + 54, 54, C.forest, 'center');
  });
  card(.8, 100, '+'); card(2.2, 226, MINUS);
  const f = (at, y, n, expl, math) => fila(tt, at, y, 70, n, expl, math, { sz: 40 });
  f(5, 370, '1.', 'El cuadrado del primer término:', a2);
  f(7.6, 452, '2.', 'El doble producto, con el signo del binomio:', ['± 2', aa, bb]);
  f(10.2, 534, '3.', 'El cuadrado del segundo término (siempre +):', ['+ ', b2]);
});

// 5. Ejemplo 1
ejemplo(26, 1, ['(', bl('x'), ' + ', or('5'), ')', sup('2')], [
  { at: 1.2, n: 'Paso 1.', expl: 'Identifica a y b:', math: [aa, ' = ', bl('x'), '        ', bb, ' = ', or('5')] },
  { at: 4.6, n: 'Paso 2.', expl: 'Cuadrado del primero:', math: [bl('x'), sup('2', C.blue)] },
  { at: 8, n: 'Paso 3.', expl: 'Doble producto (2ab):', math: ['2 · ', bl('x'), ' · ', or('5'), ' = 10', bl('x')] },
  { at: 11.4, n: 'Paso 4.', expl: 'Cuadrado del segundo:', math: [or('5'), sup('2', C.orange), ' = ', or('25')] },
  { at: 14.8, n: 'Paso 5.', expl: 'Junta los tres términos:', math: [bl('x'), sup('2', C.blue), ' + 10', bl('x'), ' + ', or('25')], o: LIME },
  { at: 19.4, n: '', expl: 'Comprueba con x = 1:', math: ['(1 + 5)', sup('2'), ' = 36     1 + 10 + 25 = 36  ', gr('✓')], o: { sz: 30, stroke: C.green, lw: 2.5 } }
]);

// 6. Ejemplo 2 (con resta)
ejemplo(30, 2, ['(', bl('3m'), ' ' + MINUS + ' ', or('4'), ')', sup('2')], [
  { at: 1.2, n: 'Paso 1.', expl: 'Identifica a y b:', math: [aa, ' = ', bl('3m'), '        ', bb, ' = ', or('4')] },
  { at: 4.8, n: 'Paso 2.', expl: 'Cuadrado del primero:', math: ['(', bl('3m'), ')', sup('2'), ' = ', bl('9m'), sup('2', C.blue)] },
  { at: 8.8, n: 'Paso 3.', expl: 'Doble producto, lleva el signo ' + MINUS + ':', math: ['2(', bl('3m'), ')(', or('4'), ') = 24m  →  ', MINUS, '24m'] },
  { at: 13.2, n: 'Paso 4.', expl: 'Cuadrado del segundo (siempre +):', math: [or('4'), sup('2', C.orange), ' = ', or('16')] },
  { at: 17.2, n: 'Paso 5.', expl: 'Junta los tres términos:', math: [bl('9m'), sup('2', C.blue), ' ' + MINUS + ' 24m + ', or('16')], o: LIME },
  { at: 22.2, n: '', expl: 'Comprueba con m = 1:', math: ['(3 ' + MINUS + ' 4)', sup('2'), ' = 1     9 ' + MINUS + ' 24 + 16 = 1  ', gr('✓')], o: { sz: 30, stroke: C.green, lw: 2.5 } }
]);

// 7. Ejemplo 3 (dos letras)
ejemplo(30, 3, ['(', bl('2a'), ' + ', or('3b'), ')', sup('2')], [
  { at: 1.2, n: 'Paso 1.', expl: 'Identifica a y b:', math: [aa, ' = ', bl('2a'), '        ', bb, ' = ', or('3b')] },
  { at: 4.8, n: 'Paso 2.', expl: 'Cuadrado del primero:', math: ['(', bl('2a'), ')', sup('2'), ' = ', bl('4a'), sup('2', C.blue)] },
  { at: 8.8, n: 'Paso 3.', expl: 'Doble producto (2ab):', math: ['2(', bl('2a'), ')(', or('3b'), ') = 12ab'] },
  { at: 13.2, n: 'Paso 4.', expl: 'Cuadrado del segundo:', math: ['(', or('3b'), ')', sup('2', C.orange), ' = ', or('9b'), sup('2', C.orange)] },
  { at: 17.2, n: 'Paso 5.', expl: 'Junta los tres términos:', math: [bl('4a'), sup('2', C.blue), ' + 12ab + ', or('9b'), sup('2', C.orange)], o: LIME },
  { at: 22.2, n: '', expl: 'Comprueba con a = 1 y b = 1:', math: ['(2 + 3)', sup('2'), ' = 25     4 + 12 + 9 = 25  ', gr('✓')], o: { sz: 30, stroke: C.green, lw: 2.5 } }
]);

// 8. ¡Cuidado!
escena(15, tt => {
  titulo(tt, '¡Cuidado con estos errores!');
  const card = (at, y, mal, bien, nota) => {
    withAlpha(fade(tt, at), () => {
      rr(60, y, 1160, 150, 16, C.white, C.line);
      rr(76, y + 14, 540, 74, 10, '#fbeaea'); rr(644, y + 14, 560, 74, 10, '#eaf5df');
      txt('✗', 96, y + 62, 34, C.red, { w: 700 }); txt('✓', 664, y + 62, 34, C.green, { w: 700 });
      mathMid(mal, 140, y + 51, 32, C.forest);
      mathMid(bien, 712, y + 51, 32, C.forest);
      txt(nota, 96, y + 125, 24, C.mute, { w: 700 });
    });
  };
  card(1, 112, ['(x + 5)', sup('2'), ' = x', sup('2'), ' + 25'], ['(x + 5)', sup('2'), ' = x', sup('2'), ' + 10x + 25'], 'No olvides el doble producto 2ab.');
  card(5, 282, ['(3x + 1)', sup('2'), ' = 3x', sup('2'), ' + 6x + 1'], ['(3x + 1)', sup('2'), ' = 9x', sup('2'), ' + 6x + 1'], 'Eleva al cuadrado el número y también la letra: (3x)² = 9x².');
  card(9, 452, ['(x ' + MINUS + ' 4)', sup('2'), ' = x', sup('2'), ' ' + MINUS + ' 8x ' + MINUS + ' 16'], ['(x ' + MINUS + ' 4)', sup('2'), ' = x', sup('2'), ' ' + MINUS + ' 8x + 16'], 'El cuadrado del segundo término siempre es positivo.');
});

// 9. Ahora tú
escena(20, tt => {
  titulo(tt, 'Ahora tú', 60, 32);
  withAlpha(fade(tt, .3), () => mathAt(['(', bl('4x'), ' ' + MINUS + ' ', or('1'), ')', sup('2')], W / 2, 150, 70, C.forest, 'center'));
  const cd = tt < 2 ? -1 : tt < 10 ? Math.ceil(10 - tt) : 0;
  if (tt >= .8 && tt < 10) {
    withAlpha(Math.min(fade(tt, .8), 1 - fade(tt, 9.5, .5)), () => {
      txt('Pausa el video y desarróllalo en tu cuaderno', W / 2, 270, 34, C.forest, { w: 600, f: FM, align: 'center' });
      txt('Cuadrado del primero, doble producto y cuadrado del segundo', W / 2, 312, 26, C.mute, { align: 'center' });
      if (cd > 0) {
        ctx.strokeStyle = C.line; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(W / 2, 470, 86, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = C.lime; ctx.lineCap = 'round'; ctx.beginPath();
        ctx.arc(W / 2, 470, 86, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - (tt - 2) / 8)); ctx.stroke();
        txt(String(cd), W / 2, 500, 86, C.forest, { w: 700, f: FM, align: 'center' });
      }
    });
  }
  const o = { sz: 36 }, h = 74, y0 = 196, g = 10;
  fila(tt, 10.3, y0, h, 'Paso 1.', 'Identifica a y b:', [aa, ' = ', bl('4x'), '        ', bb, ' = ', or('1')], o);
  fila(tt, 12.3, y0 + (h + g), h, 'Paso 2.', 'Los dos cuadrados:', ['(', bl('4x'), ')', sup('2'), ' = ', bl('16x'), sup('2', C.blue), '     ', or('1'), sup('2', C.orange), ' = ', or('1')], o);
  fila(tt, 14.3, y0 + 2 * (h + g), h, 'Paso 3.', 'Doble producto, con el signo ' + MINUS + ':', ['2(', bl('4x'), ')(', or('1'), ') = 8x  →  ', MINUS, '8x'], o);
  fila(tt, 16.3, y0 + 3 * (h + g), h, 'Paso 4.', 'Resultado:', [bl('16x'), sup('2', C.blue), ' ' + MINUS + ' 8x + ', or('1')], Object.assign({}, o, LIME));
});

// 10. Para recordar
escena(13, tt => {
  titulo(tt, 'Para recordar');
  const p = (at, y, n, txtl, math) => withAlpha(fade(tt, at), () => {
    rr(60, y, 1160, 64, 14, C.white, C.line);
    ctx.fillStyle = C.forest; ctx.beginPath(); ctx.arc(104, y + 32, 20, 0, Math.PI * 2); ctx.fill();
    txt(String(n), 104, y + 41, 24, C.lime, { w: 700, f: FM, align: 'center' });
    txt(txtl, 144, y + 41, 26, C.forest);
    if (math) mathMid(math, 1196, y + 32, 32, C.forest, 'right');
  });
  p(.8, 104, 1, 'El cuadrado de un binomio tiene tres términos.');
  p(2.2, 178, 2, 'Cuadrado del primero, doble producto y cuadrado del segundo.');

    mathAt(['(', aa, ' ' + MINUS + ' ', bb, ')', sup('2'), ' = ', a2, ' ' + MINUS + ' 2', aa, bb, ' + ', b2], 96, 580, 46, C.forest);

const TOTAL = ESC.reduce((s, e) => s + e.dur, 0);
const FADE = .35;
function dibujarEn(T) {
  T = Math.max(0, Math.min(T, TOTAL - 1e-6));
  let a = 0, i = 0;
  while (i < ESC.length - 1 && T >= a + ESC[i].dur) { a += ESC[i].dur; i++; }
  const tt = T - a, d = ESC[i].dur;
  fondo(); ctx.save(); ESC[i].draw(tt); ctx.restore();
  const o = Math.max(1 - tt / FADE, 1 - (d - tt) / FADE, 0);
  if (o > 0) { ctx.fillStyle = `rgba(246,243,234,${Math.min(1, o)})`; ctx.fillRect(0, 0, W, H); }
}
function inicioDeEscena(n) { let a = 0; for (let i = 0; i < n; i++) a += ESC[i].dur; return a; }

async function cargarFuentes() {
  await Promise.all([
    document.fonts.load('600 40px Outfit', 'x²−±√áéíóú·→'), document.fonts.load('700 40px Outfit', 'x²−±√áéíóú'),
    document.fonts.load('400 24px Karla', 'x²−±√áéíóú'), document.fonts.load('700 24px Karla', 'x²−±√áéíóú')
  ]);
}
async function subir(nombre, blob) { await fetch('/subir/' + nombre, { method: 'POST', body: blob }); }
async function guardarCuadro(T, nombre, tipo = 'image/png') {
  dibujarEn(T);
  const b = await new Promise(r => cv.toBlob(r, tipo, .92));
  await subir(nombre, b);
}

// ---------- codificación ----------
async function hacerVideo(nombre = 'video.mp4', opc = {}) {
  const DUR = opc.seg || TOTAL, QP = opc.qp || 0, HW = opc.hw || 'no-preference';
  await cargarFuentes();
  window.estado = 'cargando audio';
  const SR = 48000;
  const ac = new AudioContext({ sampleRate: SR });
  const src = await ac.decodeAudioData(await (await fetch('/matematicas-1/materiales/jerarquia-de-operaciones.mp4')).arrayBuffer());
  const N = Math.round(DUR * SR), ch = [src.getChannelData(0), src.getChannelData(1)];
  const pcm = [new Float32Array(N), new Float32Array(N)];
  for (let c = 0; c < 2; c++) for (let i = 0; i < N; i++) {
    let g = 1; const s = i / SR;
    if (s > DUR - 3) g = Math.max(0, (DUR - s) / 3);
    pcm[c][i] = (i < ch[c].length ? ch[c][i] : 0) * g;
  }
  const muxer = new Muxer({ target: new ArrayBufferTarget(), fastStart: 'in-memory',
    video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR } });
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { window.estado = 'error video ' + e; } });
  ve.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: opc.br || 700000, bitrateMode: opc.mode || 'variable', framerate: FPS, hardwareAcceleration: HW });
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { window.estado = 'error audio ' + e; } });
  ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 96000 });
  const NF = Math.round(DUR * FPS);
  for (let f = 0; f < NF; f++) {
    dibujarEn(f / FPS);
    const bm = await createImageBitmap(cv); // copia fija del cuadro ya dibujado
    const vf = new VideoFrame(bm, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); bm.close();
    ve.encode(vf, QP ? { keyFrame: f % 150 === 0, avc: { quantizer: QP } } : { keyFrame: f % 150 === 0 }); vf.close();
    while (ve.encodeQueueSize > 12) await new Promise(r => setTimeout(r, 2));
    if (f % 150 === 0) { window.estado = 'video ' + f + '/' + NF; await new Promise(r => setTimeout(r, 0)); }
  }
  window.estado = 'audio';
  const CH = SR; // 1 s por bloque
  for (let s = 0; s < N; s += CH) {
    const n = Math.min(CH, N - s), data = new Float32Array(n * 2);
    data.set(pcm[0].subarray(s, s + n), 0); data.set(pcm[1].subarray(s, s + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(s * 1e6 / SR), data });
    ae.encode(ad); ad.close();
  }
  await ve.flush(); await ae.flush(); muxer.finalize();
  const buf = muxer.target.buffer;
  window.estado = 'subiendo ' + buf.byteLength;
  await subir(nombre, new Blob([buf], { type: 'video/mp4' }));
  window.estado = 'listo ' + buf.byteLength;
  return buf.byteLength;
}

Object.assign(window, { dibujarEn, guardarCuadro, hacerVideo, cargarFuentes, TOTAL, inicioDeEscena, ESC });
await cargarFuentes();
dibujarEn(0);
window.listo = true;
