<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador del video: método de Cramer</title>
<!--
  Genera el video matematicas-3/materiales/tema-01-cramer.mp4 (metodo de Cramer, sistemas 2x2).
  Mismo motor que generar-video-ecuaciones-imaginarias.html (canvas 1280x720 a 30 cuadros por segundo,
  estilo "Compas", WebCodecs H.264 + AAC y mp4-muxer; musica de los otros videos), con una pieza mas
  para dibujar determinantes 2x2.
  Uso: abrir esta pagina desde un servidor local (http://localhost:.../materiales-fuente/...) en Chrome/Edge y,
  en la consola, llamar  await hacerVideo('nombre.mp4', {hw:'prefer-software', br:500000})  (sube el .mp4 a /subir/...)
  o dibujarEn(segundos) para ver un cuadro.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Karla:wght@400;700&display=swap">
<style>body{margin:0;background:#222}canvas{width:960px;height:540px;display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs';
import { cargarVoz, mezclar } from './voz-video.mjs';

const W = 1280, H = 720, FPS = 30;
const C = { forest:'#14301f', cream:'#f6f3ea', lime:'#c4e86b', blue:'#2f6db5', orange:'#c2621b', red:'#b3261e',
            green:'#2f7d3b', plum:'#7b3fa0', mute:'#3a6b4a', line:'#d7d2c2', white:'#ffffff' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FM = 'Outfit, "DejaVu Sans", "Segoe UI", sans-serif', FT = 'Karla, "Segoe UI", sans-serif';
const MINUS = '−', PM = '±', DOT = '·';

// ---------- motor de fórmulas: texto, superíndice, subíndice, fracción apilada y raíz ----------
const t = (s, c) => ({ t: s, c }), sup = (n, c) => ({ sup: n, c }), sub = (n, c) => ({ sub: n, c });
const fr = (n, d) => ({ fr: [n, d] }), sq = n => ({ sq: n });
const bl = s => t(s, C.blue), or = s => t(s, C.orange), pl = s => t(s, C.plum), rd = s => t(s, C.red), gr = s => t(s, C.green);
const arr = n => Array.isArray(n) ? n : [n];
let FW = 600;
function setFont(sz) { ctx.font = `${FW} ${sz}px ${FM}`; }
function meas(nodes, sz) {
  let w = 0, asc = sz * .78, desc = 0;
  for (const n of arr(nodes)) { const r = measOne(n, sz); w += r.w; asc = Math.max(asc, r.asc); desc = Math.max(desc, r.desc); }
  return { w, asc, desc };
}
function measOne(n, sz) {
  if (Array.isArray(n)) return meas(n, sz);
  if (n.det) return detMeas(n, sz);
  if (typeof n === 'string') n = { t: n };
  if (n.t !== undefined) { setFont(sz); return { w: ctx.measureText(n.t).width, asc: sz * .78, desc: 0 }; }
  if (n.sup) { const s = sz * .62, r = meas(n.sup, s); return { w: r.w + sz * .03, asc: sz * .42 + r.asc, desc: 0 }; }
  if (n.sub) { const s = sz * .62, r = meas(n.sub, s); return { w: r.w + sz * .03, asc: sz * .78, desc: sz * .2 + r.desc }; }
  if (n.fr) {
    const s = sz * .85, a = meas(n.fr[0], s), b = meas(n.fr[1], s);
    return { w: Math.max(a.w, b.w) + sz * .2, asc: sz * .42 + a.asc + a.desc, desc: Math.max(0, b.asc + b.desc - sz * .18) };
  }
  if (n.sq) { const r = meas(n.sq, sz); return { w: r.w + sz * .52, asc: r.asc + sz * .16, desc: Math.max(r.desc, sz * .08) }; }
  return { w: 0, asc: 0, desc: 0 };
}
function drawSeq(nodes, x, y, sz, col) {
  let w = 0;
  for (const n of arr(nodes)) w += drawOne(n, x + w, y, sz, col);
  return w;
}
function drawOne(n, x, y, sz, col) {
  if (Array.isArray(n)) return drawSeq(n, x, y, sz, col);
  if (n.det) return detDraw(n, x, y, sz, n.c || col);
  if (typeof n === 'string') n = { t: n };
  const c = n.c || col;
  if (n.t !== undefined) { setFont(sz); ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(n.t, x, y); return ctx.measureText(n.t).width; }
  if (n.sup) return drawSeq(n.sup, x, y - sz * .42, sz * .62, c) + sz * .03;
  if (n.sub) return drawSeq(n.sub, x, y + sz * .18, sz * .62, c) + sz * .03;
  if (n.fr) {
    const s = sz * .85, a = meas(n.fr[0], s), b = meas(n.fr[1], s), Wd = Math.max(a.w, b.w), x0 = x + sz * .1, axis = y - sz * .3;
    drawSeq(n.fr[0], x0 + (Wd - a.w) / 2, axis - sz * .12 - a.desc, s, c);
    drawSeq(n.fr[1], x0 + (Wd - b.w) / 2, axis + sz * .12 + b.asc, s, c);
    ctx.strokeStyle = c; ctx.lineWidth = Math.max(3, sz * .08); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(x0 - sz * .04, axis); ctx.lineTo(x0 + Wd + sz * .04, axis); ctx.stroke();
    return Wd + sz * .2;
  }
  if (n.sq) {
    const inn = meas(n.sq, sz), top = y - inn.asc - sz * .08, bot = y + sz * .06;
    ctx.strokeStyle = c; ctx.lineWidth = Math.max(2, sz * .06); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + sz * .02, y - sz * .28); ctx.lineTo(x + sz * .1, y - sz * .33); ctx.lineTo(x + sz * .22, bot);
    ctx.lineTo(x + sz * .38, top); ctx.lineTo(x + sz * .42 + inn.w + sz * .08, top); ctx.stroke();
    drawSeq(n.sq, x + sz * .42, y, sz, c);
    return inn.w + sz * .52;
  }
  return 0;
}
// dibuja las fórmulas centradas / alineadas
function mathAt(nodes, x, y, sz, col = C.forest, align = 'left') {
  const m = meas(nodes, sz);
  const x0 = align === 'center' ? x - m.w / 2 : align === 'right' ? x - m.w : x;
  drawSeq(nodes, x0, y, sz, col);
  return m;
}
function mathMid(nodes, x, ymid, sz, col, align) { // centra verticalmente
  const m = meas(nodes, sz);
  mathAt(nodes, x, ymid + (m.asc - m.desc) / 2, sz, col, align);
  return m;
}

// ---------- utilidades de dibujo ----------
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const fade = (tt, at, d = .6) => ease((tt - at) / d);
function rr(x, y, w, h, r, fill, stroke, lw = 1.5) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function txt(s, x, y, sz, col, o = {}) {
  ctx.font = `${o.w || 400} ${sz}px ${o.f || FT}`; ctx.fillStyle = col; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y); return ctx.measureText(s).width;
}
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = Math.min(1, a); fn(); ctx.restore(); }

function fondo() {
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(196,232,107,.55)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, 0); ctx.lineTo(0, 130); ctx.fill();
  ctx.fillStyle = 'rgba(196,232,107,.38)'; ctx.beginPath(); ctx.arc(1230, 745, 135, 0, Math.PI * 2); ctx.fill();
  rr(936, 682, 330, 32, 16, 'rgba(20,48,31,.88)');
  ctx.fillStyle = C.lime; ctx.beginPath(); ctx.arc(953, 698, 4.5, 0, Math.PI * 2); ctx.fill();
  txt('DTI. Maria del Carmen Pérez Zarate', 964, 704, 16, '#eef3e6', { w: 700 });
}
function titulo(tt, s, y = 72, sz = 44) { withAlpha(fade(tt, .1), () => txt(s, W / 2, y, sz, C.forest, { w: 600, f: FM, align: 'center' })); }

// fila de un paso: tarjeta con explicación a la izquierda y fórmula a la derecha
function fila(tt, at, y, h, n, expl, math, o = {}) {
  withAlpha(fade(tt, at), () => {
    rr(60, y, 1160, h, 14, o.fill || C.white, o.stroke || C.line, o.lw || 1.5);
    let x = 88;
    if (n) x += txt(n, x, y + h / 2 + 8, 22, o.lab || C.mute, { w: 600, f: FM }) + 16;
    txt(expl, x, y + h / 2 + 8, 24, C.forest, { w: o.lime ? 700 : 400 });
  });
  if (math) withAlpha(fade(tt, at + 1.3), () => mathMid(math, 1196, y + h / 2, o.sz || 40, C.forest, 'right'));
}

// ---------- piezas de las ecuaciones ----------
const X2 = c => [t('x', c), sup('2', c)];
const iI = pl('i');
const X = bl('x');
const x1 = [bl('x'), sub('1', C.blue)], x2 = [bl('x'), sub('2', C.blue)];

// ---------- determinante 2×2 como pieza de fórmula ----------
// dt(a, b, c, d, col, color): col = 0 o 1 resalta esa columna (la que se cambió)
const dt = (a, b, c, d, col, color) => ({ det: [[a, b], [c, d]], col: col === undefined ? -1 : col, hlc: color || 'rgba(196,232,107,.85)' });
function detLay(n, sz) {
  const cw = [0, 1].map(j => Math.max(meas(n.det[0][j], sz).w, meas(n.det[1][j], sz).w));
  const pad = sz * .45, edge = sz * .42;
  return { cw, pad, edge, w: edge + cw[0] + pad + cw[1] + edge + sz * .08 };
}
function detMeas(n, sz) { const L = detLay(n, sz); return { w: L.w, asc: sz * 1.3, desc: sz * .72 }; }
// centro de cada celda: para dibujar flechas encima
function detCell(n, x, y, sz, i, j) {
  const L = detLay(n, sz); const x0 = x + L.edge + (j ? L.cw[0] + L.pad : 0);
  return { cx: x0 + L.cw[j] / 2, cy: y - sz * .3 + (i ? .5 : -.5) * sz };
}
function detDraw(n, x, y, sz, col) {
  const L = detLay(n, sz), top = y - sz * 1.28, bot = y + sz * .68;
  if (n.col >= 0) {
    const hx = x + L.edge + (n.col ? L.cw[0] + L.pad : 0);
    rr(hx - sz * .14, top + sz * .06, L.cw[n.col] + sz * .28, bot - top - sz * .12, sz * .12, n.hlc);
  }
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2.5, sz * .07); ctx.lineCap = 'round';
  [x + sz * .12, x + L.w - sz * .2].forEach(bx => { ctx.beginPath(); ctx.moveTo(bx, top); ctx.lineTo(bx, bot); ctx.stroke(); });
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const w = meas(n.det[i][j], sz).w, x0 = x + L.edge + (j ? L.cw[0] + L.pad : 0) + (L.cw[j] - w) / 2;
    drawSeq(n.det[i][j], x0, y - sz * .3 + (i ? .5 : -.5) * sz + sz * .28, sz, col);
  }
  return L.w;
}

const a1 = t('a', C.blue), b1 = t('b', C.plum), c1 = t('c', C.orange);
const A = (k) => [t('a', C.blue), sub(k, C.blue)], B = (k) => [t('b', C.plum), sub(k, C.plum)], Cc = (k) => [t('c', C.orange), sub(k, C.orange)];
const Dl = ['Δ'], Dx = ['Δ', sub('x')], Dy = ['Δ', sub('y')];
const N = s => MINUS + s;

// ---------- escenas ----------
const ESC = [];
function escena(dur, draw) { ESC.push({ dur, draw }); }

// fila de un paso (mismo estilo que los otros videos)
const filaD = (tt, at, y, h, n, expl, math, o) => fila(tt, at, y, h, n, expl, math, Object.assign({ sz: 32 }, o || {}));
const LIME = { fill: C.lime, stroke: C.lime, lime: true };

// 0. Portada
escena(5, tt => {
  withAlpha(fade(tt, .2), () => txt('MATEMÁTICAS 3  ·  TEMA 1  ·  SISTEMAS DE ECUACIONES', W / 2, 190, 22, C.mute, { w: 700, align: 'center' }));
  withAlpha(fade(tt, .5), () => {
    ctx.font = `600 78px ${FM}`; const w1 = ctx.measureText('Método de ').width;
    ctx.font = `700 78px ${FM}`; const w2 = ctx.measureText('Cramer').width, x0 = W / 2 - (w1 + w2) / 2;
    txt('Método de ', x0, 320, 78, C.forest, { w: 600, f: FM });
    txt('Cramer', x0 + w1, 320, 78, C.blue, { w: 700, f: FM });
  });
  withAlpha(fade(tt, 1.4), () => { ctx.fillStyle = C.lime; ctx.fillRect(W / 2 - 130, 356, 260, 6); });
  withAlpha(fade(tt, 1.8), () => mathAt(['Δ = ', dt('a', 'b', 'c', 'd'), ' = ad ', MINUS, ' bc'], W / 2, 490, 56, C.forest, 'center'));
  withAlpha(fade(tt, 2.8), () => txt('Resolver un sistema 2×2 con determinantes, paso a paso', W / 2, 600, 28, C.forest, { align: 'center' }));
});

// 1. El determinante 2×2
escena(16, tt => {
  titulo(tt, 'El determinante de una matriz 2×2');
  const SZ = 84, X0 = 130, Y0 = 290;
  withAlpha(fade(tt, .6), () => {
    mathAt(['Δ = '], 60, Y0, SZ, C.forest);
    const d = dt('a', 'b', 'c', 'd'); const wD = meas(['Δ = '], SZ).w;
    mathAt([d], 60 + wD, Y0, SZ, C.forest);
  });
  const wD = meas(['Δ = '], SZ).w, d0 = dt('a', 'b', 'c', 'd'), xd = 60 + wD;
  const P = (i, j) => detCell(d0, xd, Y0, SZ, i, j);
  const dia = (p, q, col, a0) => withAlpha(fade(tt, a0), () => {
    ctx.strokeStyle = col; ctx.globalAlpha *= .8; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.setLineDash([]);
    const dx = q.cx - p.cx, dy = q.cy - p.cy, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
    ctx.beginPath(); ctx.moveTo(p.cx - ux * 34, p.cy - uy * 34); ctx.lineTo(q.cx + ux * 34, q.cy + uy * 34); ctx.stroke();
  });
  dia(P(0, 0), P(1, 1), C.blue, 3);
  dia(P(0, 1), P(1, 0), C.orange, 7);
  withAlpha(fade(tt, 3.6), () => mathAt([t('a', C.blue), ' ', DOT, ' ', t('d', C.blue)], 740, 232, 50, C.forest));
  withAlpha(fade(tt, 3.6), () => txt('diagonal principal', 740, 262, 24, C.blue, { w: 700 }));
  withAlpha(fade(tt, 7.6), () => mathAt([MINUS, ' ', t('b', C.orange), ' ', DOT, ' ', t('c', C.orange)], 740, 340, 50, C.forest));
  withAlpha(fade(tt, 7.6), () => txt('la otra diagonal, restando', 740, 370, 24, C.orange, { w: 700 }));
  withAlpha(fade(tt, 10.4), () => {
    rr(60, 440, 1160, 190, 16, C.white, C.line);
    txt('EJEMPLO', 90, 480, 20, C.mute, { w: 700 });
    mathAt(['Δ = ', dt('7', '4', '5', N('2')), ' = 7(', MINUS, '2) ', MINUS, ' 4(5) = ', MINUS, '14 ', MINUS, ' 20 = ', MINUS, '34'], 90, 580, 46, C.forest);
  });
});

// 2. Los tres determinantes
escena(17, tt => {
  titulo(tt, 'Un sistema, tres determinantes');
  withAlpha(fade(tt, .5), () => {
    mathAt([A('1'), 'x + ', B('1'), 'y = ', Cc('1')], 640, 134, 38, C.forest, 'center');
    mathAt([A('2'), 'x + ', B('2'), 'y = ', Cc('2')], 640, 188, 38, C.forest, 'center');
  });
  const card = (at, x, title, d, sub1) => withAlpha(fade(tt, at), () => {
    rr(x, 232, 360, 250, 16, C.white, C.line);
    txt(title, x + 180, 272, 26, C.forest, { w: 700, f: FM, align: 'center' });
    mathAt([d], x + 180, 376, 60, C.forest, 'center');
    txt(sub1, x + 180, 450, 20, C.mute, { align: 'center' });
  });
  card(2, 60, 'Δ  (principal)', dt(A('1'), B('1'), A('2'), B('2')), 'los coeficientes de x y de y');
  card(6, 460, 'Δx', dt(Cc('1'), B('1'), Cc('2'), B('2'), 0), 'cambia la columna de x');
  card(10, 860, 'Δy', dt(A('1'), Cc('1'), A('2'), Cc('2'), 1), 'cambia la columna de y');
  withAlpha(fade(tt, 13), () => {
    rr(60, 520, 1160, 130, 16, C.lime);
    mathAt(['x = ', fr(['Δ', sub('x')], ['Δ']), '            y = ', fr(['Δ', sub('y')], ['Δ'])], 640, 614, 52, C.forest, 'center');
    txt('(siempre que Δ sea distinto de 0)', 1180, 640, 20, C.forest, { align: 'right' });
  });
});

// 3. Pasos
escena(12, tt => {
  titulo(tt, 'Los pasos del método de Cramer');
  const p = (at, y, n, txtl, math) => withAlpha(fade(tt, at), () => {
    rr(60, y, 1160, 84, 14, C.white, C.line);
    ctx.fillStyle = C.forest; ctx.beginPath(); ctx.arc(106, y + 42, 22, 0, Math.PI * 2); ctx.fill();
    txt(String(n), 106, y + 51, 25, C.lime, { w: 700, f: FM, align: 'center' });
    txt(txtl, 148, y + 51, 27, C.forest);
    if (math) mathMid(math, 1190, y + 42, 36, C.forest, 'right');
  });
  p(.8, 110, 1, 'Ordena las ecuaciones: x, y = número', [t('ax + by = c', C.forest)]);
  p(2.6, 204, 2, 'Calcula el determinante principal', [Dl, ' = ad ', MINUS, ' bc']);
  p(4.4, 298, 3, 'Si Δ ≠ 0, calcula Δx y Δy (cambia la columna)', [Dx, '   ', Dy]);
  p(6.2, 392, 4, 'Divide entre el determinante principal', ['x = ', fr([Dx], [Dl]), '      y = ', fr([Dy], [Dl])]);
  p(8, 486, 5, 'Comprueba en las dos ecuaciones');
});

// 4. Ejemplo 1
escena(37, tt => {
  titulo(tt, 'Ejemplo 1', 60, 32);
  withAlpha(fade(tt, .3), () => mathAt(['7x + 4y = 13', '        ', '5x ', MINUS, ' 2y = 19'], W / 2, 140, 46, C.forest, 'center'));
  const h = 88, y0 = 174, g = 9, o = { sz: 32 };
  filaD(tt, 1.4, y0, h, 'Paso 1.', 'Determinante principal:', [Dl, ' = ', dt('7', '4', '5', N('2')), ' = ', N('14 '), MINUS, ' 20 = ', N('34')], o);
  filaD(tt, 7.4, y0 + (h + g), h, 'Paso 2.', 'Para Δx cambia la columna de x:', [Dx, ' = ', dt('13', '4', '19', N('2'), 0), ' = ', N('26 '), MINUS, ' 76 = ', N('102')], o);
  filaD(tt, 14, y0 + 2 * (h + g), h, 'Paso 3.', 'Para Δy cambia la columna de y:', [Dy, ' = ', dt('7', '13', '5', '19', 1), ' = 133 ', MINUS, ' 65 = 68'], o);
  filaD(tt, 21, y0 + 3 * (h + g), h, 'Paso 4.', 'Divide entre Δ:', ['x = ', fr([N('102')], [N('34')]), ' = 3', '       y = ', fr(['68'], [N('34')]), ' = ', N('2')], Object.assign({ sz: 34 }, LIME));
  filaD(tt, 28, y0 + 4 * (h + g), h, 'Paso 5.', 'Comprueba:', ['7(3) + 4(', N('2'), ') = 13 ', gr('✓'), '      5(3) ', MINUS, ' 2(', N('2'), ') = 19 ', gr('✓')], { sz: 28, stroke: C.green, lw: 2.5 });
});

// 5. Ejemplo 2
escena(35, tt => {
  titulo(tt, 'Ejemplo 2: con números negativos', 60, 32);
  withAlpha(fade(tt, .3), () => mathAt(['2x ', MINUS, ' 3y = 13', '        ', '3x + 5y = ', N('9')], W / 2, 140, 46, C.forest, 'center'));
  const h = 88, y0 = 174, g = 9, o = { sz: 32 };
  filaD(tt, 1.4, y0, h, 'Paso 1.', 'Δ: cuidado con el signo, 2(5) − (−3)(3)', [Dl, ' = ', dt('2', N('3'), '3', '5'), ' = 10 + 9 = 19'], { sz: 30 });
  filaD(tt, 8, y0 + (h + g), h, 'Paso 2.', 'Para Δx cambia la columna de x:', [Dx, ' = ', dt('13', N('3'), N('9'), '5', 0), ' = 65 ', MINUS, ' 27 = 38'], o);
  filaD(tt, 14.6, y0 + 2 * (h + g), h, 'Paso 3.', 'Para Δy cambia la columna de y:', [Dy, ' = ', dt('2', '13', '3', N('9'), 1), ' = ', N('18 '), MINUS, ' 39 = ', N('57')], o);
  filaD(tt, 21.6, y0 + 3 * (h + g), h, 'Paso 4.', 'Divide entre Δ:', ['x = ', fr(['38'], ['19']), ' = 2', '       y = ', fr([N('57')], ['19']), ' = ', N('3')], Object.assign({ sz: 34 }, LIME));
  filaD(tt, 28.6, y0 + 4 * (h + g), h, 'Paso 5.', 'Comprueba:', ['2(2) ', MINUS, ' 3(', N('3'), ') = 13 ', gr('✓'), '      3(2) + 5(', N('3'), ') = ', N('9 '), gr('✓')], { sz: 28, stroke: C.green, lw: 2.5 });
});

// 6. ¿Y si Δ = 0?
escena(14, tt => {
  titulo(tt, '¿Y si el determinante es 0?');
  withAlpha(fade(tt, .5), () => mathAt(['x + y = 4', '        ', '2x + 2y = 10'], W / 2, 160, 50, C.forest, 'center'));
  fila(tt, 2, 210, 110, '', 'Calculamos el determinante principal:', [Dl, ' = ', dt('1', '1', '2', '2'), ' = 2 ', MINUS, ' 2 = 0'], { sz: 38 });
  withAlpha(fade(tt, 6), () => {
    rr(60, 350, 1160, 150, 18, C.forest);
    txt('Δ = 0  →  no se puede aplicar Cramer', W / 2, 410, 40, C.lime, { w: 700, f: FM, align: 'center' });
    txt('el sistema no tiene solución o tiene un infinito de soluciones', W / 2, 460, 28, '#eef3e6', { align: 'center' });
  });
  withAlpha(fade(tt, 10), () => txt('Se revisa con otro método (por ejemplo, el gráfico).', W / 2, 570, 28, C.forest, { w: 700, align: 'center' }));
});

// 7. ¡Cuidado!
escena(15, tt => {
  titulo(tt, '¡Cuidado con estos errores!');

// voz en off (guion en voz/cramer.json): alarga las escenas para que alcance a hablar
const VOZ = await cargarVoz('cramer', ESC);
const TOTAL = ESC.reduce((s, e) => s + e.dur, 0);
const FADE = .35;
function dibujarEn(T) {
  T = Math.max(0, Math.min(T, TOTAL - 1e-6));
  let a = 0, i = 0;
  while (i < ESC.length - 1 && T >= a + ESC[i].dur) { a += ESC[i].dur; i++; }
  const tt = T - a, d = ESC[i].dur;
  fondo(); ctx.save(); ESC[i].draw(tt); ctx.restore();
  const o = Math.max(1 - tt / FADE, 1 - (d - tt) / FADE, 0);
  if (o > 0) { ctx.fillStyle = `rgba(246,243,234,${Math.min(1, o)})`; ctx.fillRect(0, 0, W, H); }
}
function inicioDeEscena(n) { let a = 0; for (let i = 0; i < n; i++) a += ESC[i].dur; return a; }

async function cargarFuentes() {
  await Promise.all([
    document.fonts.load('600 40px Outfit', 'x²−±√áéíóú·→'), document.fonts.load('700 40px Outfit', 'x²−±√áéíóú'),

  ]);
}
async function subir(nombre, blob) { await fetch('/subir/' + nombre, { method: 'POST', body: blob }); }
async function guardarCuadro(T, nombre, tipo = 'image/png') {
  dibujarEn(T);
  const b = await new Promise(r => cv.toBlob(r, tipo, .92));
  await subir(nombre, b);
}

// ---------- codificación ----------
async function hacerVideo(nombre = 'video.mp4', opc = {}) {
  const DUR = opc.seg || TOTAL, QP = opc.qp || 0, HW = opc.hw || 'no-preference';
  await cargarFuentes();
  window.estado = 'cargando audio';
  const SR = 48000;
  const ac = new AudioContext({ sampleRate: SR });
  const src = await ac.decodeAudioData(await (await fetch('/matematicas-1/materiales/jerarquia-de-operaciones.mp4')).arrayBuffer());
  const N = Math.round(DUR * SR), ch = [src.getChannelData(0), src.getChannelData(1)];
  const pcm = mezclar(DUR, ch, VOZ ? VOZ.pistas : []); // música en bucle + voz (la música baja al hablar)

  const muxer = new Muxer({ target: new ArrayBufferTarget(), fastStart: 'in-memory',
    video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR } });
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { window.estado = 'error video ' + e; } });
  ve.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: opc.br || 700000, bitrateMode: opc.mode || 'variable', framerate: FPS, hardwareAcceleration: HW });
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { window.estado = 'error audio ' + e; } });
  ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 96000 });
  const NF = Math.round(DUR * FPS);
  for (let f = 0; f < NF; f++) {
    dibujarEn(f / FPS);
    const bm = await createImageBitmap(cv); // copia fija del cuadro ya dibujado
    const vf = new VideoFrame(bm, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); bm.close();
    ve.encode(vf, QP ? { keyFrame: f % 150 === 0, avc: { quantizer: QP } } : { keyFrame: f % 150 === 0 }); vf.close();
    while (ve.encodeQueueSize > 12) await new Promise(r => setTimeout(r, 2));
    if (f % 150 === 0) { window.estado = 'video ' + f + '/' + NF; await new Promise(r => setTimeout(r, 0)); }
  }
  window.estado = 'audio';
  const CH = SR; // 1 s por bloque
  for (let s = 0; s < N; s += CH) {
    const n = Math.min(CH, N - s), data = new Float32Array(n * 2);
    data.set(pcm[0].subarray(s, s + n), 0); data.set(pcm[1].subarray(s, s + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(s * 1e6 / SR), data });
    ae.encode(ad); ad.close();
  }
  await ve.flush(); await ae.flush(); muxer.finalize();
  const buf = muxer.target.buffer;
  window.estado = 'subiendo ' + buf.byteLength;
  await subir(nombre, new Blob([buf], { type: 'video/mp4' }));
  window.estado = 'listo ' + buf.byteLength;
  return buf.byteLength;
}

Object.assign(window, { dibujarEn, guardarCuadro, hacerVideo, cargarFuentes, TOTAL, inicioDeEscena, ESC });
